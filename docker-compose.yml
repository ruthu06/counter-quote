services:
  api:
    build: ./backend
    ports:
      - "5080:5080"
    volumes:
      - ./backend:/src
      - ./data:/data

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:5080
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
